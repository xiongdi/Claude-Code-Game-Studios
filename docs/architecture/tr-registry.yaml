# 技术需求 ID 注册表
#
# 用途：为每个 GDD 技术需求提供持久、稳定的 ID。
# 防止在多次 /architecture-review 运行中重新编号 TR-ID，
# 否则会破坏 story 引用。
#
# 规则：
#   - ID 是永久的。永远不要重新编号，永远不要删除（使用 status: deprecated）。
#   - 仅在每个系统列表的末尾添加新条目。
#   - 当 GDD 需求被重新措辞（相同意图）时：更新 `requirement`
#     文本并添加 `revised` 日期。ID 保持不变。
#   - 当需求从 GDD 中移除时：设置 status: deprecated。
#   - 当需求被拆分或替换时：设置 status: superseded-by 指向
#     新的 TR-ID。
#
# 编写者：/architecture-review（追加新条目，不覆盖）
# 读取者：/create-stories（在 story 中嵌入 ID）
#          /story-done（审查时查找当前需求文本）
#          /story-readiness（验证 TR-ID 存在且处于 active 状态）
#
# ID 格式：TR-[system-slug]-[NNN]
#   system-slug = 匹配 GDD 系统名称的短横线名称
#   NNN = 每个系统的三位零填充序号，从 001 开始
#
# 状态值：active | deprecated | superseded-by: TR-[system]-NNN

version: 1
last_updated: ""

requirements: []

